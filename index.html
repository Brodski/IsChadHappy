        // One account = one independent chain (puuid lookup if needed, then ranked)
        async function fetchAccountRanking(account) {
            if (!account.puuid) {
                console.log("Getting account info by name", account);
                account.puuid = await account.getPuuidByName();
            }
            const rank = await account.getRankedLolByPuuid();

            console.log("**********************************************");
            console.log("account.puuid: ", account.puuid);
            console.log("Current name: ", rank.length > 0 ? rank[0].summonerName : "");
            console.log("Previous names: " + account.namesAll);
            console.log(rank);

            if (rank === "error") return [];
            return rank
                .filter(rk => rk.queueType === "RANKED_SOLO_5x5")
                .map(rk => ({ ...rk, displayNameBski: account.name, tagLineBski: account.tagLine }));
        }

        function fetchLeague(tier) { // "challenger" or "grandmaster"
            return fetch(
                `https://na1.api.riotgames.com/lol/league/v4/${tier}leagues/by-queue/RANKED_SOLO_5x5`,
                { headers: { "X-Riot-Token": a_key } }
            ).then(res => {
                if (!res.ok) throw new Error(`${tier} league: HTTP ${res.status}`);
                return res.json();
            });
        }

        async function go() {
            console.log("************************************");
            console.log("******* Start fetching data ********");
            console.log("************************************");

            // 1. Fire everything now. Nothing is awaited yet.
            const accountPromises = allAccounts.map(fetchAccountRanking);
            const challengerPromise = fetchLeague("challenger");
            const grandmasterPromise = fetchLeague("grandmaster");
            // Avoid "unhandled rejection" warnings if we never end up awaiting these
            challengerPromise.catch(() => {});
            grandmasterPromise.catch(() => {});

            // 2. Wait for all accounts; one failure doesn't kill the rest
            const results = await Promise.allSettled(accountPromises);
            const allRankings = [];
            results.forEach((r, i) => {
                if (r.status === "fulfilled") allRankings.push(...r.value);
                else console.error("Failed for", allAccounts[i].name, r.reason);
            });

            console.log("*******  End fetching data  ********");
            console.log(allRankings);

            isGM = allRankings.some(r => r.tier.toUpperCase() === "GRANDMASTER");
            isMasters = allRankings.some(r => r.tier.toUpperCase() === "MASTER");

            // 3. Only now await the league data, and only if we need it.
            //    It's probably already finished downloading by this point.
            if (isGM || isMasters) {
                const [challenger, grandmaster] = await Promise.all([challengerPromise, grandmasterPromise]);
                const gm_and_chall = [...challenger.entries, ...grandmaster.entries];
                gm_and_chall.sort((a, b) => b.leaguePoints - a.leaguePoints);

                maxPointsAux_grandmaster_CONST = gm_and_chall[499]?.leaguePoints;
                maxPointsAux_Challanger_CONST = gm_and_chall[199]?.leaguePoints;
            }

            console.log("************************************");
            console.log("*******  End fetching data  ********");
            console.log("************************************");
            console.log("");
            console.log("");
            console.log("");
            console.log("^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^")
            console.log("^^^^^    Start Rendering     ^^^^^^")
            console.log("^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^")
            console.log("allRankings")
            console.log("allRankings")
            console.log("allRankings")
            renderRanking(allRankings);
        }

        for (let rank of rankings) {
            let queueType =  rank.queueType
            let divsion =  rank.rank
            let tier = rank.tier
            let points = rank.leaguePoints
            let summonerName = rank.displayNameBski;
            let info = {
                tier: rank.tier,
                divsion:  rank.rank,
                points: rank.leaguePoints,
                winLose: rank.wins + " - " + rank.losses
            }

            if (rank.displayNameBski != "Annie Bot") {
                wins = wins + rank.wins
                losses = losses + rank.losses;
            }
            let ul = document.createElement("ul")
            let anch = document.createElement("a")
            let tagAux = rank.tagLineBski ? `-${rank.tagLineBski}` : ""
            anch.setAttribute('href', 'https://na.op.gg/summoners/na/' + rank.displayNameBski.split("#")[0] + tagAux)
            anch.setAttribute('target', '_blank')
            anch.setAttribute('rel', 'noopener noreferrer')
            anch.innerText = bannedArr.includes(rank.displayNameBski ) ? rank.displayNameBski  + " (BANNED)" : rank.displayNameBski 
            ul.appendChild(anch)
            document.getElementById("main").before(ul)
            for (const [key, val] of Object.entries(info)) {
                if (key=='tier' 
                    && !bannedArr.includes(rank.displayNameBski )
                    && (val.toUpperCase() == "MASTER" || val.toUpperCase() == "GRANDMASTER")
                    && rank.displayNameBski != "Annie Bot") {
                    // chadStatText = "Chad is sad &#128546;"
                    isChadHappy = false
                }
                console.log(key + ": " + val);
                let info = key + ": " + val
                let li = document.createElement("li")
                li.innerText = info
                ul.append(li)
            }
            setTimeout( () => {positionAccountsOnMeter(info, summonerName)}, 500)
            
        }
        let ul = document.createElement("ul")
        let li = document.createElement("li")
        ul.innerText = "Total"
        li.innerText = "winLose: " + wins + " - " + losses
        ul.append(li)
        document.querySelector("#main").before(ul)

        for (let acc of bannedArr) {
            let li = document.createElement("li")
            li.innerText = acc
            document.querySelector("#banned-accounts").appendChild(li)
        }

        let imgSrc = isChadHappy ? happySrc : sadSrc
        let chadStatText = isChadHappy ? "Chad is happy " : "Chad is sad " 
      
        let ladder = document.getElementById("ladder-wrap")
        if (ladder) {
            ladder.style.visibility = "visible";
            document.getElementById("main").style.visibility = "visible";
        }

        document.getElementById("chadStatus").innerHTML = ` <div> ${chadStatText} </div> <img src=${imgSrc} ></img>`;    

        if (isGM || isMasters) {
            let html = `<div>GM cutoff - <b> ${maxPointsAux_grandmaster_CONST} </b> </div>`;
            if (isGM) {
                html += `<div>Challenger - <b> ${maxPointsAux_Challanger_CONST} </b> </div>`;
            }
            document.getElementById("lpCutoff").innerHTML = `<ul> ${html} </ul>`;
        }
        

  
    }

    function positionAccountsOnMeter(info, summonerName) {
        // let info = {
        //         tier: rank.tier,
        //         divsion:  rank.rank,
        //         points: rank.leaguePoints,
        //     }
        const runIt = () => {
            console.log("---------------------------")
            console.log(info )
            console.log(summonerName )
            let division;
            let maxPoints = 100;
            if (info.tier.toUpperCase() == "DIAMOND") {
                maxPoints = 100;
                switch (info.divsion.toUpperCase()) {
                    case 'I':
                        division = document.querySelector("#d1")
                        console.log(division)
                        break
                    case 'II':
                        division = document.querySelector("#d2")
                        console.log(division)
                        break
                    case 'III':
                        division = document.querySelector("#d3")
                        console.log(division)
                        break
                    case 'IV':
                        division = document.querySelector("#d4")
                        console.log(division)
                        break
                }
            }
            // let maxPointsAux_grandmaster = 776
            let maxPointsAux_grandmaster = maxPointsAux_grandmaster_CONST ?? 1280;
            let maxPointsAux_Challanger =  maxPointsAux_Challanger_CONST ?? 9999;

            if (info.tier.toUpperCase() == "MASTER") {
                division = document.querySelector("#masters")
                maxPoints = maxPointsAux_grandmaster
                if (info.points > maxPointsAux_grandmaster ) {
                    maxPoints = info.points + 50
                }
            }
            if (info.tier.toUpperCase() == "GRANDMASTER") {
                division = document.querySelector("#gm")
                // maxPoints = 700;
                maxPoints = maxPointsAux_Challanger;
                // if (info.points > maxPointsAux_Challanger ) {
                //     maxPoints = info.points + 50
                // }
            }

            if (!division) {
                // console.log("division not found :(")
                // Account is not diamond or above
                return
            }
            let offset = division.getBoundingClientRect().height * (1 - ((info.points - maxPointsAux_grandmaster) / (maxPoints -  maxPointsAux_grandmaster)))

            if (info.tier.toUpperCase() == "GRANDMASTER") {
                let = point_from_gm_to_chall = maxPointsAux_Challanger - maxPointsAux_grandmaster 
                let points_needed_for_chall = maxPointsAux_Challanger - info.points
                point_from_gm_to_chall = Math.max(point_from_gm_to_chall, 1) // div by zero
                offset = division.getBoundingClientRect().height * ( (points_needed_for_chall / point_from_gm_to_chall))
                
                // console.log(summonerName, info.points, maxPoints)
                // console.log("division.getBoundingClientRect().top", division.getBoundingClientRect().top)
                // console.log(`${summonerName} X, point_from_gm_to_chall: ${point_from_gm_to_chall}, points_needed_for_chall: ${points_needed_for_chall}`)

            }

            let account;
            if (document.getElementById(summonerName.replace(/\s/g, "")) ) {
                account = document.getElementById(summonerName.replace(/\s/g, ""))
            } else {
                account = document.createElement("div")
                account.id = summonerName.replace(/\s/g, "");
                account.innerText = bannedArr.includes(summonerName) ? "💀" + summonerName : summonerName; // skull and crossbones
                if (account.innerText == "Annie Bot" ) {
                    let annie = document.createElement("span")
                    let annieImg = document.createElement("img")
                    annie.appendChild(annieImg)
                    annie.classList.add("player-icon")
                    annieImg.setAttribute("src", "./annie.png")
                    account.appendChild(annie)
                }
                // account.innerText = summonerName
                document.body.appendChild(account)
                account.classList.add("meter-accounts")
            }
            let bannedOffset = 0;
            if (bannedArr.includes(summonerName) && info.points == 75) {
                bannedOffset = bannedArr.indexOf(summonerName) * 15;
                if (bannedArr.indexOf(summonerName) > 0) {
                    account.classList.add("disabled-hyphen")                    
                }
            }
            account.style.top = (division.getBoundingClientRect().top + offset + bannedOffset) + "px"
            account.style.left = (division.getBoundingClientRect().left) + "px"
        }
        runIt()
        window.addEventListener("resize", runIt)

    }
    
    function renderSomethingWentWrong(msg) {
        let myDiv = document.createElement("div") 
        myDiv.innerHTML = `<div> Something went wrong in a HTTP Request :( <br/>Error="${msg}"</div> `
        
        document.getElementsByTagName("body")[0].append(myDiv)
    }
